<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting&hellip;</title>
  <link rel="canonical" href="{{ page.redirect.to | escape }}">
  <meta name="robots" content="noindex">
  <script>
    window.location.replace({{ page.redirect.to | jsonify }} + window.location.search + window.location.hash);
  </script>
  <meta http-equiv="refresh" content="0; url={{ page.redirect.to | escape }}">
</head>
<body>
  <p><a href="{{ page.redirect.to | escape }}">Continue to the post.</a></p>
</body>
</html>
