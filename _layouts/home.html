<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <title>{{ site.title }}</title>
  
  {% seo %}
</head>
<body>
  {% include header.html %}
  
  <main class="content">
    {{ content }}
    {% if site.posts.size > 0 %}
    <section class="home-writing" aria-labelledby="writing-heading">
      <div class="section-header">
        <h2 id="writing-heading">Writing</h2>
        {% if site.posts.size > 3 %}<a href="{{ '/blog/' | relative_url }}">All posts &rarr;</a>{% endif %}
      </div>
      {% include writing-list.html limit=3 heading_level=3 %}
    </section>
    {% endif %}
  </main>

</body>
</html>
