<ul class="post-list">
  {% for post in site.posts %}
  <li>
    <time class="post-date" datetime="{{ post.date | date: '%Y-%m-%d' }}">{{ post.date | date: '%Y-%m-%d' }}</time>
    <h2 class="post-list-title"><a href="{{ post.url | relative_url }}">{{ post.title | escape }}</a></h2>
  </li>
  {% endfor %}
</ul>
